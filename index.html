<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw JSON Viewer</title>
    <style>
        body { 
            background-color: #1e1e1e; 
            color: #d4d4d4; 
            font-family: 'Courier New', Courier, monospace; 
            padding: 20px; 
        }
        pre { 
            white-space: pre-wrap; 
            word-wrap: break-word; 
            background: #2d2d2d; 
            padding: 15px; 
            border-radius: 5px; 
            border: 1px solid #444;
        }
        .error { color: #f44336; }
        .loading { color: #ffeb3b; }
    </style>
</head>
<body>
    <h1>Raw JSON Output: /r/all.json</h1>
    <div id="status" class="loading">Fetching raw data...</div>
    <pre id="json-output"></pre>

    <script>
        async function fetchRawJson() {
            const output = document.getElementById('json-output');
            const status = document.getElementById('status');

            try {
                const response = await fetch('https://www.reddit.com/r/all.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const data = await response.json();
                
                // Convert JSON object to human-readable string with 2-space indentation
                output.textContent = JSON.stringify(data, null, 2);
                status.style.display = 'none';

            } catch (err) {
                status.className = 'error';
                status.innerHTML = `<strong>Error:</strong> ${err.message}<br><br>` +
                                 `<em>Note: If you see a CORS error, Reddit is blocking the browser request.</em>`;
            }
        }

        fetchRawJson();
    </script>
</body>
</html>
