<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Briefing - Reddit Feed</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        :root {
            --bg-root: #111111;
            --bg-panel: #1f1f1f;
            --bg-hover: #2d2d2d;
            --border-color: #3b3b3b;
            --text-main: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-blue: #2899f5;
            --top-bar-bg: #212121;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-root); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Navigation Components */
        .top-bar { height: 48px; background-color: var(--top-bar-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 10; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .app-rail { width: 48px; background-color: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 20px; }
        .folder-pane { width: 220px; background-color: var(--bg-root); border-right: 1px solid var(--border-color); padding: 16px 0; }

        /* Inbox List (Scrollable) */
        .message-list { width: 350px; background-color: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .list-header { padding: 16px; font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid var(--border-color); background: var(--bg-panel); }
        #inbox-container { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border-color) transparent; }
        
        .msg-item { padding: 12px 16px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: background 0.2s; }
        .msg-item:hover { background-color: var(--bg-hover); }
        .msg-item.active { background-color: #293846; border-left: 3px solid var(--accent-blue); }
        .msg-sender { font-weight: bold; font-size: 0.9rem; display: flex; justify-content: space-between; margin-bottom: 2px; }
        .msg-subject { font-size: 0.85rem; color: var(--accent-blue); font-weight: 500; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .msg-preview { font-size: 0.8rem; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Reading Pane */
        .reading-pane { flex: 1; background-color: var(--bg-root); padding: 32px; overflow-y: auto; }
        .email-header { border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 24px; }
        .email-subject { font-size: 1.6rem; font-weight: bold; margin-bottom: 16px; color: var(--text-main); }
